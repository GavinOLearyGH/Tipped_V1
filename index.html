<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1914">
<title>Tipped · Golf HITT</title>
<style>
:root{--bg:#0c1914;--panel:#14251e;--text:#f5f6f1;--muted:#9fb0a7;--accent:#d7f171;--line:rgba(255,255,255,.10)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.shell{width:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}.topbar{height:62px;min-height:62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:rgba(12,25,20,.98);z-index:50}.tabs{display:flex;gap:6px;justify-self:start}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 11px;font:inherit;font-size:12px;font-weight:900;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#102016}.brand{font-size:18px;font-weight:950;letter-spacing:-.055em;justify-self:center;white-space:nowrap}.brand b{color:var(--accent)}.mode{justify-self:end;font-size:9px;line-height:1.2;text-align:right;text-transform:uppercase;letter-spacing:.13em;font-weight:850;color:var(--accent);max-width:96px}.stage{position:relative;flex:1;min-height:0;background:var(--bg)}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.frame.active{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;pointer-events:none}.loading.hidden{display:none}@media(max-width:390px){.topbar{grid-template-columns:auto 1fr auto;height:58px;min-height:58px;padding-left:8px;padding-right:8px}.tab{padding:7px 9px;font-size:11px}.brand{font-size:16px}.mode{font-size:8px;max-width:70px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<nav class="tabs" aria-label="Tipped modes"><button class="tab active" id="tip7Tab" type="button">TIP7</button><button class="tab" id="tip9Tab" type="button">TIP9</button></nav>
<div class="brand">TIPP<b>ED</b></div><div class="mode" id="modeLabel">QUICK BODY</div>
</header>
<section class="stage"><div class="loading" id="loading">Loading TIP7…</div><iframe id="tip7Frame" class="frame active" title="TIP7 Quick Body" src="https://gavinolearygh.github.io/TIP7_v0.1/"></iframe><iframe id="tip9Frame" class="frame" title="TIP9 Golf-HITT Quick Practice" data-src="https://gavinolearygh.github.io/TIP9_v0.1/"></iframe></section>
</main>
<script>
const $=id=>document.getElementById(id),tabs={tip7:$('tip7Tab'),tip9:$('tip9Tab')},frames={tip7:$('tip7Frame'),tip9:$('tip9Frame')},labels={tip7:'QUICK BODY',tip9:'GOLF-HITT'};let active='tip7';
function polishFrame(mode){const frame=frames[mode];try{const doc=frame.contentDocument;if(!doc)return;doc.head.querySelectorAll('style[data-tipped="1"]').forEach(x=>x.remove());const style=doc.createElement('style');style.dataset.tipped='1';style.textContent=mode==='tip7'?`html,body{background:#0c1914!important}.shell{padding-top:14px!important}.brand .logo{display:none!important}.brand{justify-content:flex-end!important;margin-bottom:8px!important;min-height:38px!important}`:`:root{--bg:#0c1914!important;--panel:#14251e!important;--panel2:#1a3027!important;--text:#f5f6f1!important;--muted:#9fb0a7!important;--accent:#d7f171!important;--line:rgba(255,255,255,.1)!important;--good:#d7f171!important}html,body{background:#0c1914!important}.app{width:min(100%,560px)!important;padding-top:14px!important}.brand{display:none!important}.btn{border-radius:16px!important}.btn:not(.secondary):not(.ghost){background:#d7f171!important;color:#102016!important}.card{border-radius:20px!important}.card.accent{border-color:rgba(215,241,113,.35)!important;background:linear-gradient(180deg,#1a3027,#14251e)!important}.eyebrow{color:#d7f171!important}`;doc.head.appendChild(style)}catch(e){}}
function ensureLoaded(mode){const frame=frames[mode];if(!frame.getAttribute('src')&&frame.dataset.src){$('loading').classList.remove('hidden');$('loading').textContent=`Loading ${mode==='tip9'?'GOLF-HITT':'TIP7'}…`;frame.src=frame.dataset.src}}
function switchMode(mode){active=mode;ensureLoaded(mode);Object.keys(frames).forEach(key=>{frames[key].classList.toggle('active',key===mode);tabs[key].classList.toggle('active',key===mode)});$('modeLabel').textContent=labels[mode];try{localStorage.setItem('tippedMode',mode)}catch(e){}}
Object.entries(frames).forEach(([mode,frame])=>frame.addEventListener('load',()=>{if(mode===active)$('loading').classList.add('hidden');polishFrame(mode)}));tabs.tip7.addEventListener('click',()=>switchMode('tip7'));tabs.tip9.addEventListener('click',()=>switchMode('tip9'));let saved='tip7';try{if(localStorage.getItem('tippedMode')==='tip9')saved='tip9'}catch(e){}switchMode(saved);
</script>
</body>
</html>
