<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1914">
<title>TIPPED · TIP7 + TIP9</title>
<style>
:root{--bg:#0c1914;--panel:#14251e;--panel2:#1a3027;--text:#f5f6f1;--muted:#9fb0a7;--accent:#d7f171;--line:rgba(255,255,255,.10)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit}.shell{width:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}.topbar{height:62px;min-height:62px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:max(8px,env(safe-area-inset-top)) 12px 8px;border-bottom:1px solid var(--line);background:rgba(12,25,20,.98);z-index:50}.tabs{display:flex;gap:6px;justify-self:start}.tab{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:900;cursor:pointer}.tab.active{background:var(--accent);border-color:var(--accent);color:#102016}.brand{border:0;background:transparent;color:var(--text);font-size:18px;font-weight:950;letter-spacing:-.055em;justify-self:center;white-space:nowrap;cursor:pointer}.brand b{color:var(--accent)}.mode{justify-self:end;font-size:9px;line-height:1.2;text-align:right;text-transform:uppercase;letter-spacing:.13em;font-weight:850;color:var(--accent);max-width:96px}.stage{position:relative;flex:1;min-height:0;background:var(--bg)}.frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--bg);display:none}.frame.active{display:block}.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:12px;pointer-events:none}.loading.hidden{display:none}.front{position:absolute;inset:0;z-index:60;background:var(--bg);overflow:auto;padding:max(28px,env(safe-area-inset-top)) 18px max(30px,env(safe-area-inset-bottom));display:flex;justify-content:center}.front.hidden{display:none}.front-inner{width:min(100%,560px);margin:auto}.front-logo{font-size:27px;font-weight:950;letter-spacing:-.055em}.front-logo b{color:var(--accent)}.front h1{font-size:44px;line-height:.96;letter-spacing:-.055em;margin:34px 0 24px}.chooser{display:grid;grid-template-columns:1fr 1fr;gap:10px}.product{border:1px solid var(--line);background:linear-gradient(180deg,var(--panel2),var(--panel));color:var(--text);border-radius:22px;padding:20px;text-align:left;cursor:pointer;min-height:245px;display:flex;flex-direction:column}.product:hover{border-color:rgba(215,241,113,.45)}.product-code{color:var(--accent);font-weight:900;font-size:13px;letter-spacing:.1em}.number{font-size:76px;font-weight:950;line-height:.95;letter-spacing:-.07em;margin:13px 0 0}.unit{font-size:13px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}.product h2{font-size:25px;letter-spacing:-.04em;margin:24px 0 6px}.product p{color:var(--muted);line-height:1.45;margin:0}.product .go{margin-top:auto;padding-top:18px;color:var(--accent);font-weight:900;font-size:13px}.prototype{margin-top:22px;text-align:center}.prototype button{border:0;background:none;color:#708279;text-decoration:underline;font-size:11px;cursor:pointer}@media(max-width:420px){.chooser{grid-template-columns:1fr}.product{min-height:205px}.front h1{font-size:38px}.number{font-size:62px}.topbar{grid-template-columns:auto 1fr auto;height:58px;min-height:58px;padding-left:8px;padding-right:8px}.tab{padding:7px 9px;font-size:11px}.brand{font-size:16px}.mode{font-size:8px;max-width:70px}}
</style>
</head>
<body>
<main class="shell">
<header class="topbar">
<nav class="tabs" aria-label="Tipped modes"><button class="tab" id="tip7Tab" type="button">TIP7</button><button class="tab" id="tip9Tab" type="button">TIP9</button></nav>
<button class="brand" id="brandBtn" type="button" aria-label="TIPPED home">TIPP<b>ED</b></button><div class="mode" id="modeLabel">FRONT DOOR</div>
</header>
<section class="stage"><div class="loading hidden" id="loading">Loading…</div><iframe id="tip7Frame" class="frame" title="TIP7 Quick Body" data-src="https://gavinolearygh.github.io/TIP7_v0.1/"></iframe><iframe id="tip9Frame" class="frame" title="TIP9 Nine-ball Practice" data-src="https://gavinolearygh.github.io/TIP9_v0.1/"></iframe>
<section class="front" id="frontDoor"><div class="front-inner"><div class="front-logo">TIPP<b>ED</b></div><h1>What are you working on?</h1><div class="chooser"><button class="product" id="front7" type="button"><div class="product-code">TIP7</div><div class="number">7</div><div class="unit">MINUTES</div><h2>Body</h2><p>Stretch · Strength</p><div class="go">START TIP7 →</div></button><button class="product" id="front9" type="button"><div class="product-code">TIP9</div><div class="number">9</div><div class="unit">BALLS</div><h2>Game</h2><p>Swing · Skill</p><div class="go">START TIP9 →</div></button></div><div class="prototype"><button id="clearPreference" type="button">Reset TIPPED start preference</button></div></div></section>
</section>
</main>
<script>
const $=id=>document.getElementById(id),tabs={tip7:$('tip7Tab'),tip9:$('tip9Tab')},frames={tip7:$('tip7Frame'),tip9:$('tip9Frame')},labels={tip7:'7-MINUTE BODY WORK',tip9:'9-BALL PRACTICE'};let active=null;
function polishFrame(mode){const frame=frames[mode];try{const doc=frame.contentDocument;if(!doc)return;doc.head.querySelectorAll('style[data-tipped="1"]').forEach(x=>x.remove());const style=doc.createElement('style');style.dataset.tipped='1';style.textContent=mode==='tip7'?`html,body{background:#0c1914!important}.shell{padding-top:14px!important}.brand .logo{display:none!important}.brand{justify-content:flex-end!important;margin-bottom:8px!important;min-height:38px!important}`:`:root{--bg:#0c1914!important;--panel:#14251e!important;--panel2:#1a3027!important;--text:#f5f6f1!important;--muted:#9fb0a7!important;--accent:#d7f171!important;--line:rgba(255,255,255,.1)!important;--good:#d7f171!important}html,body{background:#0c1914!important}.app{width:min(100%,560px)!important;padding-top:14px!important}.brand{display:none!important}.btn{border-radius:16px!important}.btn:not(.secondary):not(.ghost){background:#d7f171!important;color:#102016!important}.card{border-radius:20px!important}.card.accent{border-color:rgba(215,241,113,.35)!important;background:linear-gradient(180deg,#1a3027,#14251e)!important}.eyebrow{color:#d7f171!important}`;doc.head.appendChild(style)}catch(e){}}
function ensureLoaded(mode){const frame=frames[mode];if(!frame.getAttribute('src')&&frame.dataset.src){$('loading').classList.remove('hidden');$('loading').textContent=`Loading ${mode==='tip7'?'TIP7':'TIP9'}…`;frame.src=frame.dataset.src}}
function setTabs(mode){Object.keys(frames).forEach(key=>{frames[key].classList.toggle('active',key===mode);tabs[key].classList.toggle('active',key===mode)})}
function enterMode(mode,remember=true){active=mode;$('frontDoor').classList.add('hidden');ensureLoaded(mode);setTabs(mode);$('modeLabel').textContent=labels[mode];if(remember){try{localStorage.setItem('tippedLastMode',mode);localStorage.setItem('tippedVisited','1')}catch(e){}}window.scrollTo(0,0)}
function showFront(){active=null;Object.values(frames).forEach(f=>f.classList.remove('active'));Object.values(tabs).forEach(t=>t.classList.remove('active'));$('frontDoor').classList.remove('hidden');$('modeLabel').textContent='FRONT DOOR';$('loading').classList.add('hidden')}
Object.entries(frames).forEach(([mode,frame])=>frame.addEventListener('load',()=>{if(mode===active)$('loading').classList.add('hidden');polishFrame(mode)}));
tabs.tip7.addEventListener('click',()=>enterMode('tip7'));tabs.tip9.addEventListener('click',()=>enterMode('tip9'));$('front7').addEventListener('click',()=>enterMode('tip7'));$('front9').addEventListener('click',()=>enterMode('tip9'));$('brandBtn').addEventListener('click',showFront);$('clearPreference').addEventListener('click',()=>{try{localStorage.removeItem('tippedVisited');localStorage.removeItem('tippedLastMode')}catch(e){}showFront()});
let visited=false,last='tip7';try{visited=localStorage.getItem('tippedVisited')==='1';if(localStorage.getItem('tippedLastMode')==='tip9')last='tip9'}catch(e){}if(visited)enterMode(last,false);else showFront();
</script>
</body>
</html>
